name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps .
      - name: Check base installation before test extras
        run: python -I tests/check_base_install.py
      - run: python -m pip install ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: authmatrix validate examples/matrix.json
      - run: authmatrix validate examples/json-matrix.json
      - run: authmatrix validate examples/tenant-matrix.json
