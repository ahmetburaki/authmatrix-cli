name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps .
      - name: Check base installation before test extras
        run: python -I tests/check_base_install.py
      - run: python -m pip install ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: authmatrix validate examples/matrix.json
      - run: authmatrix validate examples/json-matrix.json
      - run: authmatrix validate examples/tenant-matrix.json
      - run: authmatrix validate examples/hostname-matrix.json
  distribution:
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.14'
      - run: python -m pip install ".[test]" -r requirements/packaging.txt
      - run: python -m build --sdist --wheel --outdir dist
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python tools/check_dist.py dist --require-clean
      - name: Verify portable checksum manifest
        run: |
          python -c "
          from pathlib import Path
          manifest = Path('dist/SHA256SUMS').read_bytes()
          if b'\r' in manifest:
              raise SystemExit('SHA256SUMS must use LF line endings')
          "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: authmatrix-candidate-${{ matrix.os }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
