[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "authmatrix-cli"
dynamic = ["version"]
description = "Local and staging API authorization regression evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ahmetburaki"}]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema==4.26.0"]

[project.urls]
Repository = "https://github.com/ahmetburaki/authmatrix-cli"
Issues = "https://github.com/ahmetburaki/authmatrix-cli/issues"
Documentation = "https://github.com/ahmetburaki/authmatrix-cli/tree/main/docs"

[project.scripts]
authmatrix = "authmatrix.cli:main"

[tool.setuptools.packages.find]
include = ["authmatrix*"]

[tool.setuptools.package-data]
authmatrix = ["schemas/*.json"]

[tool.setuptools.dynamic]
version = {attr = "authmatrix.__version__"}
