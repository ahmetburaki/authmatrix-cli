[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authmatrix-cli"
version = "0.1.0"
description = "Local and staging API authorization regression evidence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema==4.26.0"]

[project.scripts]
authmatrix = "authmatrix.cli:main"

[tool.setuptools.packages.find]
include = ["authmatrix*"]

[tool.setuptools.package-data]
authmatrix = ["schemas/*.json"]
